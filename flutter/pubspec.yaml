name: breathe_flutter
description: Flutter rewrite of the Breathe breathing coach app.
publish_to: "none"

version: 1.0.5+3

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.4.0
  shared_preferences: ^2.5.2
  vibration: ^3.1.3
  wakelock_plus: ^1.3.2
  flutter_watch_os_connectivity: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/phase-exhale.mp3
    - assets/sounds/phase-hold.mp3
    - assets/sounds/phase-inhale.mp3
