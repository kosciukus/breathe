name: breathe_wearos
description: Breathe — Wear OS watch app.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  wear: ^1.0.0
  provider: ^6.1.2
  shared_preferences: ^2.5.2
  vibration: ^3.1.3
  audioplayers: ^6.1.0
  health: ^12.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/phase-inhale.mp3
    - assets/sounds/phase-hold.mp3
    - assets/sounds/phase-exhale.mp3
